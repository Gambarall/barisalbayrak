<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Barış Albayrak kişisel web sitesi. Bilgi, deneyim ve gelişim.">
  <title>Barış Albayrak | Çok Yakında</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #111318;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    .line {
      width: 55px;
      height: 3px;
      background: #c9a96e;
      margin: 30px auto;
    }

    h1 {
      font-size: clamp(32px, 7vw, 58px);
      letter-spacing: 5px;
      font-weight: 600;
    }

    .slogan {
      color: #c9a96e;
      font-size: 15px;
      letter-spacing: 3px;
      margin-top: 18px;
    }

    h2 {
      font-size: 27px;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    .description {
      color: #b9bbc2;
      font-size: 16px;
      line-height: 1.8;
    }

    footer {
      margin-top: 65px;
      color: #777b85;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>BARIŞ ALBAYRAK</h1>
    <p class="slogan">BİLGİ. DENEYİM. GELİŞİM.</p>

    <div class="line"></div>

    <h2>ÇOK YAKINDA</h2>

    <p class="description">
      Kişisel web sitem çok yakında yayında olacak.
      <br>
      Çalışmalarım, projelerim ve profesyonel yolculuğum
      hakkında daha fazlası için takipte kalın.
    </p>

    <footer>© 2026 Barış Albayrak. Tüm hakları saklıdır.</footer>
  </main>
</body>
</html>
